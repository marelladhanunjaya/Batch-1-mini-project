<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Contact Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .contact-card {
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-action {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            line-height: 1rem;
            font-weight: 600;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn-edit {
            background-color: #3b82f6;
            color: white;
        }
        .btn-edit:hover {
            background-color: #2563eb;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <!-- Main Container -->
    <div class="max-w-4xl w-full bg-white rounded-xl shadow-2xl p-6 md:p-10 mb-8">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-gray-800">Class Contact Directory</h1>
            <p class="text-gray-500 mt-2">Manage and connect with your classmates and teachers.</p>
        </header>

        <!-- Loading & Status -->
        <div id="status-display" class="mb-6 text-center">
            <p id="loading-message" class="text-indigo-600 font-medium">Authenticating...</p>
        </div>

        <!-- Login Form -->
        <div id="login-container" class="hidden max-w-md mx-auto p-6 bg-gray-50 rounded-xl shadow-inner mb-6">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4 text-center">Sign In</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="login-email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="login-password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                </div>
                <button type="submit" class="w-full btn-primary">Sign In / Sign Up</button>
                <div id="login-message-box" class="mt-4 p-3 hidden rounded-md text-sm text-center"></div>
            </form>
        </div>

        <!-- Main App Content -->
        <div id="app-container" class="hidden">
             <!-- User Info and Logout -->
            <div class="mb-6 text-center flex justify-between items-center bg-gray-100 p-3 rounded-lg">
                <p class="font-mono text-xs md:text-sm text-gray-500 break-all">
                    Signed in as: <span id="user-email-text" class="font-bold text-gray-700"></span>
                </p>
                <button id="logout-button" class="btn-action btn-delete">Log Out</button>
            </div>
            
            <!-- Add/Edit Contact Form -->
            <div class="bg-gray-50 p-6 rounded-xl shadow-inner mb-6">
                <h2 id="form-title" class="text-2xl font-semibold text-gray-700 mb-4">Add New Contact</h2>
                <form id="contact-form" class="space-y-4">
                    <input type="hidden" id="contact-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                            <input type="tel" id="phone" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
                            <select id="role" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                                <option value="">Select Role</option>
                                <option value="Student">Student</option>
                                <option value="Teacher">Teacher</option>
                            </select>
                        </div>
                        <div>
                            <label for="class" class="block text-sm font-medium text-gray-700">Class</label>
                            <input type="text" id="class" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                    </div>

                    <!-- Dynamic Fields for Student Role -->
                    <div id="student-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                            <select id="gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div id="student-position-field" class="hidden">
                            <label for="student-position" class="block text-sm font-medium text-gray-700">Position</label>
                            <select id="student-position" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                                <option value="">Select Position</option>
                                <option value="CR">Class Representative</option>
                                <option value="Girls Representative">Girls Representative</option>
                                <option value="Normal">Normal Student</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dynamic Fields for Teacher Role -->
                    <div id="teacher-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                        <div>
                            <label for="teacher-gender" class="block text-sm font-medium text-gray-700">Gender</label>
                            <select id="teacher-gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div id="teacher-position-field" class="hidden">
                            <label for="teacher-position" class="block text-sm font-medium text-gray-700">Position</label>
                            <select id="teacher-position" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                                <option value="">Select Position</option>
                                <option value="Faculty">Faculty</option>
                                <option value="Non-Faculty">Non-Faculty</option>
                                <option value="Lab Person">Lab Person</option>
                                <option value="HOD">HOD</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="form-button" class="w-full btn-primary">Add Contact</button>
                    <button type="button" id="cancel-button" class="w-full mt-2 hidden text-sm text-gray-500">Cancel</button>
                </form>
                <div id="message-box" class="mt-4 p-3 hidden rounded-md text-sm text-center"></div>
            </div>

            <!-- Search Section -->
            <div class="bg-gray-50 p-6 rounded-xl shadow-inner mb-6">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Search Contacts</h2>
                <div class="flex flex-col md:flex-row gap-4 items-stretch">
                    <input type="text" id="search-input" placeholder="Search by name..." class="flex-grow rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                    <button id="search-button" class="w-full md:w-auto btn-primary p-2 px-4">Search</button>
                </div>
                <div id="search-results-container" class="mt-4 space-y-4"></div>
            </div>

            <!-- Contact List -->
            <main>
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Contact List</h2>
                <div id="contact-list" class="space-y-6">
                    <!-- Contacts will be dynamically added here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase and App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Set log level for debugging
        setLogLevel('debug');

        // --- GLOBAL VARIABLES & FIREBASE INITIALIZATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth;
        let userId = null;
        let editingDocId = null;
        let unsubscribeFromContacts = null;

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        const loadingMessageEl = document.getElementById('loading-message');
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');
        const loginMessageBox = document.getElementById('login-message-box');
        const userEmailTextEl = document.getElementById('user-email-text');
        const logoutButton = document.getElementById('logout-button');
        const contactForm = document.getElementById('contact-form');
        const formTitle = document.getElementById('form-title');
        const formButton = document.getElementById('form-button');
        const cancelButton = document.getElementById('cancel-button');
        const contactList = document.getElementById('contact-list');
        const messageBox = document.getElementById('message-box');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchResultsContainer = document.getElementById('search-results-container');
        
        // New dynamic field elements
        const roleSelect = document.getElementById('role');

        const studentFieldsContainer = document.getElementById('student-fields');
        const genderSelect = document.getElementById('gender');
        const studentPositionFieldContainer = document.getElementById('student-position-field');
        const studentPositionSelect = document.getElementById('student-position');
        
        const teacherFieldsContainer = document.getElementById('teacher-fields');
        const teacherGenderSelect = document.getElementById('teacher-gender');
        const teacherPositionFieldContainer = document.getElementById('teacher-position-field');
        const teacherPositionSelect = document.getElementById('teacher-position');

        let isAuthReady = false;

        // --- AUTHENTICATION ---
        async function handleLogin(email, password) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage(loginMessageBox, 'Sign in successful!', 'bg-green-100 text-green-700');
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        showMessage(loginMessageBox, 'New account created and signed in!', 'bg-green-100 text-green-700');
                    } catch (signupError) {
                        console.error("Sign up failed:", signupError);
                        showMessage(loginMessageBox, `Error: ${signupError.message}`, 'bg-red-100 text-red-700');
                    }
                } else {
                    console.error("Login failed:", error);
                    showMessage(loginMessageBox, `Error: ${error.message}`, 'bg-red-100 text-red-700');
                }
            }
        }

        auth.onAuthStateChanged(user => {
            loadingMessageEl.classList.add('hidden');
            if (user) {
                userId = user.uid;
                userEmailTextEl.textContent = user.email || 'Anonymous User';
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                isAuthReady = true;
                if (unsubscribeFromContacts) {
                    unsubscribeFromContacts();
                }
                setupRealtimeListener();
            } else {
                userId = null;
                loginContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                console.log("No user signed in. Showing login form.");
                if (initialAuthToken) {
                    signInWithCustomToken(auth, initialAuthToken).catch(error => {
                        console.error("Authentication with custom token failed:", error);
                        showMessage(loginMessageBox, `Error: ${error.message}`, 'bg-red-100 text-red-700');
                    });
                }
            }
        });
        
        // --- FIREBASE OPERATIONS ---
        function getContactsCollection() {
            if (!userId) {
                console.error("User ID is not available. Cannot access Firestore.");
                return null;
            }
            return collection(db, `artifacts/${appId}/users/${userId}/contacts`);
        }

        async function addContact(contactData) {
            const contactsCollection = getContactsCollection();
            if (!contactsCollection) return;

            try {
                await addDoc(contactsCollection, contactData);
                showMessage(messageBox, 'Contact added successfully!', 'bg-green-100 text-green-700');
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage(messageBox, 'Error: Could not add contact. ' + error.message, 'bg-red-100 text-red-700');
            }
        }

        async function updateContact(docId, updatedData) {
            const contactsCollection = getContactsCollection();
            if (!contactsCollection) return;

            try {
                await updateDoc(doc(db, contactsCollection.path, docId), updatedData);
                showMessage(messageBox, 'Contact updated successfully!', 'bg-green-100 text-green-700');
                resetForm();
            } catch (error) {
                console.error("Error updating document: ", error);
                showMessage(messageBox, 'Error: Could not update contact. ' + error.message, 'bg-red-100 text-red-700');
            }
        }

        async function deleteContact(docId) {
            const contactsCollection = getContactsCollection();
            if (!contactsCollection) return;
            try {
                await deleteDoc(doc(db, contactsCollection.path, docId));
                showMessage(messageBox, 'Contact deleted successfully.', 'bg-yellow-100 text-yellow-700');
            } catch (error) {
                console.error("Error deleting document: ", error);
                showMessage(messageBox, 'Error: Could not delete contact. ' + error.message, 'bg-red-100 text-red-700');
            }
        }

        async function searchContacts() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            searchResultsContainer.innerHTML = '';
            
            if (searchTerm === '') {
                searchResultsContainer.innerHTML = '<p class="text-gray-500 text-center">Please enter a name to search.</p>';
                return;
            }

            const contactsCollection = getContactsCollection();
            if (!contactsCollection) return;

            try {
                const q = collection(db, `artifacts/${appId}/users/${userId}/contacts`);
                const querySnapshot = await getDocs(q);
                const results = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.name.toLowerCase().includes(searchTerm)) {
                        results.push({ id: doc.id, ...data });
                    }
                });

                renderSearchResults(results);

            } catch (error) {
                console.error("Error searching documents: ", error);
                showMessage(messageBox, 'Error searching contacts: ' + error.message, 'bg-red-100 text-red-700');
            }
        }

        // --- REAL-TIME DATA LISTENER ---
        function setupRealtimeListener() {
            const contactsCollection = getContactsCollection();
            if (!contactsCollection) return;

            unsubscribeFromContacts = onSnapshot(contactsCollection, (snapshot) => {
                const contacts = {};
                console.log("Data from Firestore:", snapshot.docs.map(doc => doc.data())); 
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const contactClass = data.class;
                    const contactRole = data.role;
                    if (!contacts[contactClass]) {
                        contacts[contactClass] = { students: [], teachers: [] };
                    }
                    if (contactRole === 'Student') {
                        contacts[contactClass].students.push({ id: doc.id, ...data });
                    } else if (contactRole === 'Teacher') {
                        contacts[contactClass].teachers.push({ id: doc.id, ...data });
                    }
                });
                renderContacts(contacts);
            });
        }

        // --- UI RENDERING ---
        function renderContacts(contactsData) {
            contactList.innerHTML = '';
            const sortedClasses = Object.keys(contactsData).sort();

            if (sortedClasses.length === 0) {
                contactList.innerHTML = '<p class="text-gray-500 text-center py-4">No contacts found. Add one using the form above!</p>';
                return;
            }

            for (const className of sortedClasses) {
                const classData = contactsData[className];
                const classContainer = document.createElement('div');
                classContainer.className = 'class-section bg-white p-6 rounded-xl shadow-md mb-6';
                classContainer.innerHTML = `<h3 class="text-xl font-bold text-indigo-700 mb-4">${className}</h3>`;
                
                const roles = ['teachers', 'students'];
                for (const role of roles) {
                    if (classData[role] && classData[role].length > 0) {
                        const roleTitle = role.charAt(0).toUpperCase() + role.slice(1);
                        const roleSection = document.createElement('div');
                        roleSection.className = 'mb-4';
                        roleSection.innerHTML = `<h4 class="text-lg font-semibold text-gray-600 mb-2">${roleTitle}</h4>`;
                        
                        const contactGrid = document.createElement('div');
                        contactGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';

                        classData[role].forEach(contact => {
                            const card = document.createElement('div');
                            card.className = 'contact-card flex flex-col items-center text-center';
                            const dynamicInfo = (contact.gender ? ` - ${contact.gender}` : '') + (contact.position ? ` (${contact.position})` : '');
                            card.innerHTML = `
                                <div class="bg-indigo-100 rounded-full w-12 h-12 flex items-center justify-center text-indigo-600 font-bold text-xl mb-2">
                                    ${contact.name.charAt(0).toUpperCase()}
                                </div>
                                <div class="text-lg font-bold text-gray-800">${contact.name}</div>
                                <div class="text-sm font-medium text-gray-500">${contact.phone}</div>
                                <div class="text-xs text-gray-400 mt-1">${contact.role} - ${contact.class}${dynamicInfo}</div>
                                <div class="absolute top-2 right-2 space-x-1">
                                    <button class="btn-action btn-edit" data-id="${contact.id}" data-name="${contact.name}" data-phone="${contact.phone}" data-role="${contact.role}" data-class="${contact.class}" data-gender="${contact.gender || ''}" data-position="${contact.position || ''}">Edit</button>
                                    <button class="btn-action btn-delete" data-id="${contact.id}">Delete</button>
                                </div>
                            `;
                            contactGrid.appendChild(card);
                        });
                        roleSection.appendChild(contactGrid);
                        classContainer.appendChild(roleSection);
                    }
                }
                contactList.appendChild(classContainer);
            }
        }
        
        function renderSearchResults(results) {
            searchResultsContainer.innerHTML = '';
            if (results.length === 0) {
                searchResultsContainer.innerHTML = '<p class="text-gray-500 text-center">No contacts found with that name.</p>';
                return;
            }

            results.forEach(contact => {
                const card = document.createElement('div');
                card.className = 'contact-card flex flex-col items-center text-center';
                const dynamicInfo = (contact.gender ? ` - ${contact.gender}` : '') + (contact.position ? ` (${contact.position})` : '');
                card.innerHTML = `
                    <div class="bg-indigo-100 rounded-full w-12 h-12 flex items-center justify-center text-indigo-600 font-bold text-xl mb-2">
                        ${contact.name.charAt(0).toUpperCase()}
                    </div>
                    <div class="text-lg font-medium text-gray-800">${contact.name}</div>
                    <div class="text-sm text-gray-500">${contact.phone}</div>
                    <div class="text-xs text-gray-400 mt-1">${contact.role} - ${contact.class}${dynamicInfo}</div>
                `;
                searchResultsContainer.appendChild(card);
            });
        }

        function showMessage(element, message, className) {
            element.textContent = message;
            element.className = `mt-4 p-3 rounded-md text-sm text-center ${className}`;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 5000);
        }

        function resetForm() {
            contactForm.reset();
            formTitle.textContent = 'Add New Contact';
            formButton.textContent = 'Add Contact';
            cancelButton.classList.add('hidden');
            studentFieldsContainer.classList.add('hidden');
            teacherFieldsContainer.classList.add('hidden');
            studentPositionFieldContainer.classList.add('hidden');
            teacherPositionFieldContainer.classList.add('hidden');
            editingDocId = null;
        }

        // --- EVENT LISTENERS ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = loginEmailInput.value;
            const password = loginPasswordInput.value;
            handleLogin(email, password);
        });

        logoutButton.addEventListener('click', () => {
            signOut(auth);
            showMessage(loginMessageBox, 'You have been logged out.', 'bg-gray-100 text-gray-700');
        });

        // Dynamic form field logic based on role selection
        roleSelect.addEventListener('change', () => {
            const role = roleSelect.value;
            
            // Reset and hide all dynamic fields
            studentFieldsContainer.classList.add('hidden');
            teacherFieldsContainer.classList.add('hidden');
            studentPositionFieldContainer.classList.add('hidden');
            teacherPositionFieldContainer.classList.add('hidden');
            genderSelect.value = '';
            studentPositionSelect.value = '';
            teacherGenderSelect.value = '';
            teacherPositionSelect.value = '';

            if (role === 'Student') {
                studentFieldsContainer.classList.remove('hidden');
            } else if (role === 'Teacher') {
                teacherFieldsContainer.classList.remove('hidden');
            }
        });
        
        // Dynamic position field logic for students
        genderSelect.addEventListener('change', () => {
            if (genderSelect.value !== '') {
                studentPositionFieldContainer.classList.remove('hidden');
            } else {
                studentPositionFieldContainer.classList.add('hidden');
                studentPositionSelect.value = '';
            }
        });

        // Dynamic position field logic for teachers
        teacherGenderSelect.addEventListener('change', () => {
            if (teacherGenderSelect.value !== '') {
                teacherPositionFieldContainer.classList.remove('hidden');
            } else {
                teacherPositionFieldContainer.classList.add('hidden');
                teacherPositionSelect.value = '';
            }
        });


        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const contactClass = document.getElementById('class').value;
            
            let gender = '';
            let position = '';
            
            if (role === 'Student') {
                gender = genderSelect.value;
                if (gender) {
                    position = studentPositionSelect.value;
                }
            } else if (role === 'Teacher') {
                gender = teacherGenderSelect.value;
                if (gender) {
                    position = teacherPositionSelect.value;
                }
            }
            
            if (!name || !phone || !role || !contactClass) {
                showMessage(messageBox, 'Please fill out all required fields.', 'bg-red-100 text-red-700');
                return;
            }
            
            const contactData = {
                name: name,
                phone: phone,
                role: role,
                class: contactClass,
                gender: gender,
                position: position,
                updatedAt: new Date()
            };

            if (editingDocId) {
                updateContact(editingDocId, contactData);
            } else {
                addContact({ ...contactData, createdAt: new Date() });
            }
            contactForm.reset();
        });
        
        contactList.addEventListener('click', (e) => {
            const target = e.target;
            const docId = target.getAttribute('data-id');

            if (target.classList.contains('btn-delete')) {
                if (docId) {
                    deleteContact(docId);
                }
            } else if (target.classList.contains('btn-edit')) {
                editingDocId = docId;
                document.getElementById('name').value = target.getAttribute('data-name');
                document.getElementById('phone').value = target.getAttribute('data-phone');
                document.getElementById('role').value = target.getAttribute('data-role');
                document.getElementById('class').value = target.getAttribute('data-class');
                
                const role = target.getAttribute('data-role');
                const gender = target.getAttribute('data-gender') || '';
                const position = target.getAttribute('data-position') || '';

                // Reset and show the appropriate fields
                resetForm();
                document.getElementById('role').value = role;

                if (role === 'Student') {
                    studentFieldsContainer.classList.remove('hidden');
                    genderSelect.value = gender;
                    if (gender) {
                        studentPositionFieldContainer.classList.remove('hidden');
                        studentPositionSelect.value = position;
                    }
                } else if (role === 'Teacher') {
                    teacherFieldsContainer.classList.remove('hidden');
                    teacherGenderSelect.value = gender;
                    if (gender) {
                        teacherPositionFieldContainer.classList.remove('hidden');
                        teacherPositionSelect.value = position;
                    }
                }

                formTitle.textContent = 'Edit Contact';
                formButton.textContent = 'Update Contact';
                cancelButton.classList.remove('hidden');
            }
        });
        
        cancelButton.addEventListener('click', () => {
            resetForm();
        });

        searchButton.addEventListener('click', searchContacts);

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchContacts();
            }
        });

    </script>

</body>
</html>
